<title>Practice Sheet — MCQ Exam Drill</title>

<style>
  /* ── tokens ───────────────────────────────────────────────── */
  :root {
    --ground: #e2e5ea;
    --paper: #f7f8fa;
    --paper-edge: #d3d8e0;
    --ink: #161a22;
    --ink-soft: #5b6472;
    --ink-faint: #8b93a1;
    --rule: #ccd3dd;
    --accent: #2547a8;
    --accent-wash: #dfe5f6;
    --correct: #0e7a52;
    --correct-wash: #d9eee4;
    --wrong: #c0342b;
    --wrong-wash: #f8dedb;
    --shadow: 0 1px 2px rgba(22, 26, 34, .06), 0 12px 32px -12px rgba(22, 26, 34, .22);

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1319;
      --paper: #171c24;
      --paper-edge: #262d38;
      --ink: #e6e9ef;
      --ink-soft: #98a2b3;
      --ink-faint: #6b7686;
      --rule: #2b333f;
      --accent: #7fa0f0;
      --accent-wash: #1e2735;
      --correct: #3dd68c;
      --correct-wash: #14261f;
      --wrong: #ff6b5e;
      --wrong-wash: #2a1a1a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px -16px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0f1319;
    --paper: #171c24;
    --paper-edge: #262d38;
    --ink: #e6e9ef;
    --ink-soft: #98a2b3;
    --ink-faint: #6b7686;
    --rule: #2b333f;
    --accent: #7fa0f0;
    --accent-wash: #1e2735;
    --correct: #3dd68c;
    --correct-wash: #14261f;
    --wrong: #ff6b5e;
    --wrong-wash: #2a1a1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px -16px rgba(0, 0, 0, .7);
  }

  :root[data-theme="light"] {
    --ground: #e2e5ea;
    --paper: #f7f8fa;
    --paper-edge: #d3d8e0;
    --ink: #161a22;
    --ink-soft: #5b6472;
    --ink-faint: #8b93a1;
    --rule: #ccd3dd;
    --accent: #2547a8;
    --accent-wash: #dfe5f6;
    --correct: #0e7a52;
    --correct-wash: #d9eee4;
    --wrong: #c0342b;
    --wrong-wash: #f8dedb;
    --shadow: 0 1px 2px rgba(22, 26, 34, .06), 0 12px 32px -12px rgba(22, 26, 34, .22);
  }

  /* ── page ─────────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(16px, 4vw, 56px) clamp(12px, 4vw, 32px);
  }

  .shell { width: 100%; max-width: 720px; }

  /* the sheet, with registration marks + OMR timing strip */
  .sheet {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 2px;
    box-shadow: var(--shadow);
    padding: clamp(22px, 4vw, 40px) clamp(18px, 4vw, 44px) clamp(22px, 4vw, 36px) clamp(30px, 5vw, 62px);
  }

  /* timing marks down the left edge, like a real scannable form */
  .sheet::before {
    content: "";
    position: absolute;
    top: 34px;
    bottom: 34px;
    left: 12px;
    width: 7px;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--ink) 0 6px,
      transparent 6px 16px
    );
    opacity: .3;
  }

  .marks { position: absolute; inset: 9px; pointer-events: none; }
  .marks i {
    position: absolute;
    width: 11px;
    height: 11px;
    border: 1.5px solid var(--ink);
    opacity: .35;
  }
  .marks i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .marks i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .marks i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .marks i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  /* ── header ───────────────────────────────────────────────── */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(24px, 5vw, 33px);
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }

  /* boxed form fields for the live readouts */
  .fields { display: flex; gap: 8px; }

  .field {
    border: 1px solid var(--rule);
    background: color-mix(in srgb, var(--paper) 70%, var(--ground));
    padding: 5px 10px 6px;
    min-width: 70px;
  }
  .field span {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .field strong {
    display: block;
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }

  /* ── progress bubbles ─────────────────────────────────────── */
  .strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 15px 0 18px;
    border-bottom: 1px solid var(--rule);
  }
  .strip .label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 4px;
  }
  .pip {
    width: 19px; height: 19px;
    border-radius: 50%;
    border: 1.5px solid var(--rule);
    font-family: var(--mono);
    font-size: 9px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    display: grid;
    place-items: center;
    transition: transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .pip[data-state="active"] {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }
  .pip[data-state="right"] { background: var(--correct); border-color: var(--correct); color: var(--paper); }
  .pip[data-state="wrong"] { background: var(--wrong); border-color: var(--wrong); color: var(--paper); }

  /* ── question ─────────────────────────────────────────────── */
  .question { display: flex; gap: 16px; padding: 26px 0 22px; }

  .qnum {
    flex: none;
    border: 1.5px solid var(--ink);
    padding: 2px 9px 4px;
    text-align: center;
    align-self: flex-start;
  }
  .qnum b {
    display: block;
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .qnum span {
    display: block;
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }

  .qbody { min-width: 0; }
  .qtag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .qtext {
    font-family: var(--serif);
    font-size: clamp(19px, 3.4vw, 23px);
    line-height: 1.38;
    margin: 0;
    max-width: 34em;
    text-wrap: pretty;
  }

  /* ── options ──────────────────────────────────────────────── */
  .options { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: color-mix(in srgb, var(--paper) 82%, var(--ground));
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 13px 15px;
    cursor: pointer;
    transition: border-color .16s ease, background-color .16s ease, transform .16s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }

  .letter {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink-faint);
    width: 13px;
  }

  /* the bubble */
  .bubble {
    flex: none;
    position: relative;
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    transition: border-color .16s ease;
  }
  .bubble::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: currentColor;
    transform: scale(0);
    transition: transform .2s cubic-bezier(.34, 1.56, .64, 1);
  }
  .opt:hover:not(:disabled) .bubble { border-color: var(--accent); }

  .opt .text { font-size: 15.5px; line-height: 1.4; }

  /* graded states */
  .opt[data-mark="right"] {
    border-color: var(--correct);
    background: var(--correct-wash);
    color: var(--correct);
  }
  .opt[data-mark="right"] .bubble { border-color: var(--correct); }
  .opt[data-mark="right"] .bubble::after { transform: scale(1); }
  .opt[data-mark="right"] .letter { color: var(--correct); }

  .opt[data-mark="wrong"] {
    border-color: var(--wrong);
    background: var(--wrong-wash);
    color: var(--wrong);
    animation: strike .34s ease;
  }
  .opt[data-mark="wrong"] .bubble { border-color: var(--wrong); }
  .opt[data-mark="wrong"] .bubble::after { transform: scale(1); }
  .opt[data-mark="wrong"] .letter { color: var(--wrong); }

  .opt[data-mark="key"] {
    border-color: var(--correct);
    border-style: dashed;
    color: var(--correct);
  }
  .opt[data-mark="key"] .bubble { border-color: var(--correct); }
  .opt[data-mark="muted"] { opacity: .45; }

  /* the marker's tick / cross, stamped at the row end */
  .stamp {
    margin-left: auto;
    flex: none;
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 700;
    line-height: 1;
    opacity: 0;
  }
  .opt[data-mark="right"] .stamp,
  .opt[data-mark="wrong"] .stamp { animation: stamp .26s .06s cubic-bezier(.34, 1.56, .64, 1) forwards; }

  @keyframes strike {
    0%, 100% { transform: translateX(0); }
    22% { transform: translateX(-7px); }
    55% { transform: translateX(6px); }
    80% { transform: translateX(-3px); }
  }
  @keyframes stamp {
    from { opacity: 0; transform: scale(.4) rotate(-14deg); }
    to { opacity: 1; transform: scale(1) rotate(-7deg); }
  }

  /* ── footer / verdict ─────────────────────────────────────── */
  .footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 18px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  .verdict {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .02em;
    color: var(--ink-soft);
    min-height: 34px;
    display: flex;
    align-items: center;
    max-width: 42ch;
    line-height: 1.45;
  }
  .verdict[data-tone="right"] { color: var(--correct); }
  .verdict[data-tone="wrong"] { color: var(--wrong); }

  .btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    padding: 11px 20px;
    cursor: pointer;
    transition: opacity .16s ease, transform .16s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .28; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); }

  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 4px;
    color: var(--ink-soft);
  }

  /* ── results ──────────────────────────────────────────────── */
  .result { padding: 30px 0 4px; }
  .score {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .score b { font-size: clamp(52px, 12vw, 76px); font-weight: 700; line-height: .9; letter-spacing: -.03em; }
  .score i { font-style: normal; font-size: 19px; color: var(--ink-faint); }
  .grade {
    font-family: var(--serif);
    font-size: clamp(19px, 4vw, 24px);
    margin: 18px 0 26px;
    max-width: 30em;
    line-height: 1.35;
    text-wrap: balance;
  }

  .review { border-top: 1px solid var(--rule); }
  .row {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 3px 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row .n {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    padding-top: 3px;
  }
  .row .q { font-family: var(--serif); font-size: 16px; line-height: 1.4; }
  .row .a {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.65;
    grid-column: 2;
  }
  .row .a em { font-style: normal; color: var(--ink-faint); }
  .row .a .yes { color: var(--correct); }
  .row .a .no { color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ── loading ──────────────────────────────────────────────── */
  .loading {
    padding: 60px 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ── colophon ─────────────────────────────────────────────── */
  .colophon {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 16px;
    margin-top: 14px;
    padding: 0 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--ink-faint);
  }
  .colophon button {
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .colophon button:hover { color: var(--ink); }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width: 520px) {
    .masthead { align-items: flex-start; }
    .fields { width: 100%; }
    .field { flex: 1; min-width: 0; }
    .question { gap: 12px; }
  }
</style>

<div class="shell">
  <main class="sheet">
    <div class="marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header class="masthead">
      <div>

    <section id="result" class="hidden">

        <div class="footer" style="margin-top:0;border-top:0;padding-top:0">
          <button class="btn" id="again">Start a new sheet</button>
          <button class="btn ghost" id="toggle-review">Show answer key</button>
        </div>
      </div>
      <div class="review hidden" id="review"></div>
    </section>
  </main>

  <div class="colophon">
    <span id="source">Bank: local · 236 questions</span>
    <button id="theme">Switch theme</button>
  </div>
</div>

  /* ── helpers ────────────────────────────────────────────── */
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const clock = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };

  /* Live questions from Open Trivia DB. Works when the page is
     opened from disk or served; blocked in the published sandbox,
     where we quietly fall back to BANK. */
  async function fetchLive(n) {
    const url = `https://opentdb.com/api.php?amount=${n}&type=multiple&encode=url3986`;
    const ctrl = new AbortController();
    const bail = setTimeout(() => ctrl.abort(), 6000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.response_code !== 0 || !Array.isArray(data.results)) throw new Error("bad payload");
      const d = decodeURIComponent;
      return data.results.map((q) => [
        d(q.category).replace(/^Entertainment: |^Science: /, ""),
        d(q.question),
        d(q.correct_answer),
        q.incorrect_answers.map(d)
      ]);
    } finally {
      clearTimeout(bail);
    }
  }

  /* ── round setup ────────────────────────────────────────── */
  async function newRound() {
    ui.quiz.classList.add("hidden");
    ui.result.classList.add("hidden");
    ui.review.classList.add("hidden");
    el("toggle-review").textContent = "Show answer key";
    ui.loading.classList.remove("hidden");
    ui.loading.textContent = "Drawing questions…";

    let drawn = null;
    try {
      drawn = await fetchLive(PER_ROUND);
      sourceLabel = "live";
    } catch (err) {
      drawn = shuffle(BANK).slice(0, PER_ROUND);
      sourceLabel = "local";
    }

    paper = drawn.map(([cat, q, right, wrongs]) => {
      const opts = shuffle([right, ...wrongs.slice(0, 3)]);
      return { cat, q, right, opts, key: opts.indexOf(right) };
    });

    at = 0; score = 0; streak = 0; bestStreak = 0; log = [];
    ui.source.textContent = sourceLabel === "live"
      ? "Bank: live · Open Trivia DB"
      : `Bank: local · ${BANK.length} questions`;

    buildStrip();
    ui.loading.classList.add("hidden");
    ui.quiz.classList.remove("hidden");

    started = performance.now();
    clearInterval(ticker);
    ticker = setInterval(() => { ui.fTime.textContent = clock(performance.now() - started); }, 250);

    render();
  }

  function buildStrip() {
    ui.strip.querySelectorAll(".pip").forEach((p) => p.remove());
    paper.forEach((_, i) => {
      const pip = document.createElement("div");
      pip.className = "pip";
      pip.textContent = i + 1;
      ui.strip.appendChild(pip);
    });
  }

  const pips = () => ui.strip.querySelectorAll(".pip");

  /* ── render one question ────────────────────────────────── */
  function render() {
    const item = paper[at];
    locked = false;

    ui.qNum.textContent = at + 1;
    ui.qOf.textContent = `/${paper.length}`;
    ui.qTag.textContent = item.cat;
    ui.qText.innerHTML = item.q;

    pips().forEach((p, i) => {
      if (!p.dataset.state || p.dataset.state === "active") {
        p.dataset.state = i === at ? "active" : "";
      }
    });

    ui.options.innerHTML = "";
    item.opts.forEach((text, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.innerHTML =
        `<span class="letter">${LETTERS[i]}</span>` +
        `<span class="bubble" aria-hidden="true"></span>` +
        `<span class="text">${text}</span>` +
        `<span class="stamp" aria-hidden="true"></span>`;
      b.addEventListener("click", () => answer(i));
      ui.options.appendChild(b);
    });

    ui.verdict.dataset.tone = "";
    ui.verdict.innerHTML = 'Pick an option — or press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd>';
    ui.next.disabled = true;
    ui.next.textContent = at === paper.length - 1 ? "Grade my sheet" : "Next question";
    syncFields();
  }

  function syncFields() {
    ui.fScore.textContent = `${score}/${log.length}`;
    ui.fStreak.textContent = streak;
  }

  /* ── grading a single answer ────────────────────────────── */
  function answer(picked) {
    if (locked) return;
    locked = true;

    const item = paper[at];
    const right = picked === item.key;
    const rows = ui.options.querySelectorAll(".opt");

    rows.forEach((row, i) => {
      row.disabled = true;
      const stamp = row.querySelector(".stamp");
      if (i === picked) {
        row.dataset.mark = right ? "right" : "wrong";
        stamp.textContent = right ? "✓" : "✕";
      } else if (i === item.key) {
        row.dataset.mark = "key";
      } else {
        row.dataset.mark = "muted";
      }
    });

    if (right) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
    } else {
      streak = 0;
    }

    log.push({ q: item.q, picked: item.opts[picked], right: item.right, ok: right });
    pips()[at].dataset.state = right ? "right" : "wrong";

    ui.verdict.dataset.tone = right ? "right" : "wrong";
    ui.verdict.innerHTML = right
      ? `Correct — <strong>${item.right}</strong>.${streak >= 3 ? ` ${streak} in a row.` : ""}`
      : `Not quite. The answer is <strong>${item.right}</strong>.`;

    ui.next.disabled = false;
    ui.next.focus({ preventScroll: true });
    syncFields();
  }

  /* ── advance / grade the sheet ──────────────────────────── */
  function advance() {
    if (!locked) return;
    if (at < paper.length - 1) {
      at++;
      render();
    } else {
      finish();
    }
  }

  function finish() {
    clearInterval(ticker);
    const pct = Math.round((score / paper.length) * 100);
    const elapsed = clock(performance.now() - started);

    ui.quiz.classList.add("hidden");
    ui.result.classList.remove("hidden");
    ui.rScore.textContent = score;
    ui.rPct.textContent = `of ${paper.length} · ${pct}% · ${elapsed}`;

    const grade =
      pct === 100 ? "A clean sheet. Every bubble matched the answer key."
      : pct >= 80 ? "Strong pass. Look over the two or three you dropped and sit another sheet."
      : pct >= 50 ? "A working pass. The answer key below is where the marks are hiding."
      : "Below the line this time — read the key, then run a fresh sheet on the same topics.";
    ui.rGrade.textContent = `${grade}${bestStreak >= 3 ? ` Best run: ${bestStreak} correct in a row.` : ""}`;

    ui.review.innerHTML = log.map((r, i) => `
      <div class="row">
        <div class="n">${String(i + 1).padStart(2, "0")}</div>
        <div class="q">${r.q}</div>
        <div class="a">
          ${r.ok
            ? `<em>You answered</em> <span class="yes">${r.picked}</span>`
            : `<em>You answered</em> <span class="no">${r.picked}</span><br><em>Answer key</em> <span class="yes">${r.right}</span>`}
        </div>
      </div>`).join("");
  }

  /* ── wiring ─────────────────────────────────────────────── */
  ui.next.addEventListener("click", advance);
  el("again").addEventListener("click", newRound);

  el("toggle-review").addEventListener("click", (e) => {
    const hidden = ui.review.classList.toggle("hidden");
    e.currentTarget.textContent = hidden ? "Show answer key" : "Hide answer key";
  });

  document.addEventListener("keydown", (e) => {
    if (ui.quiz.classList.contains("hidden")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const k = e.key.toUpperCase();
    const byLetter = LETTERS.indexOf(k);
    const byDigit = "1234".indexOf(k);
    const idx = byLetter > -1 ? byLetter : byDigit;

    if (idx > -1 && !locked) {
      e.preventDefault();
      answer(idx);
    } else if ((e.key === "Enter" || e.key === " ") && locked && document.activeElement !== ui.next) {
      e.preventDefault();
      advance();
    }
  });

  el("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme
      ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });

  newRound();
})();
</script>
